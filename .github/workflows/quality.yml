name: Frontend quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate static application
        run: node scripts/check.mjs
      - name: Test API write and read races
        run: node scripts/test-api-reliability.mjs
      - name: Test holiday batch save races
        run: node scripts/test-holiday-reliability.mjs
      - name: Test Action Plan save races
        run: node scripts/test-action-plan-reliability.mjs
      - name: Test calendar synchronization races
        run: node scripts/test-calendar-sync.mjs
      - name: Test actual STORE contract validation
        run: node scripts/test-store-contract.mjs
      - name: Test calendar creation acknowledgments
        run: node scripts/test-calendar-create.mjs
      - name: Test consolidated holiday disposal math
        run: node scripts/test-holiday-consolidated-math.mjs
      - name: Test overtime budget diagnostics and store matching
        run: node scripts/test-overtime-budget-store-match.mjs
      - name: Test store name resolution across imports
        run: node scripts/test-store-name-resolution.mjs
      - name: Test import independence
        run: node scripts/test-import-independence.mjs
      - name: Test personnel hours module runtime
        run: node scripts/test-personnel-hours-runtime.mjs
      - name: Test unmatched store report
        run: node scripts/test-unmatched-store-report.mjs
      - name: Test import parsers runtime
        run: node scripts/test-import-parsers-runtime.mjs
      - name: Test DM overview page
        run: node scripts/test-dm-overview-page.mjs
      - name: Alternanza settimane e festivita nel calendario DM
        run: node scripts/test-calendar-week-holidays.mjs
      - name: Parita di resa fra profili DM e RM
        run: node scripts/test-rm-dm-view-parity.mjs
      - name: Action Plan RM con righe del profilo DM
        run: node scripts/test-rm-action-plan-parity.mjs
      - name: Calendario posizionato sulla settimana corrente
        run: node scripts/test-calendar-today-focus.mjs
      - name: Synthetic client cache benchmark
        run: node scripts/benchmark-api-client.mjs
