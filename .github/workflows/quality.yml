name: Frontend quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate static application
        run: node scripts/check.mjs
      - name: Test API write and read races
        run: node scripts/test-api-reliability.mjs
      - name: Test holiday batch save races
        run: node scripts/test-holiday-reliability.mjs
      - name: Test Action Plan save races
        run: node scripts/test-action-plan-reliability.mjs
      - name: Test calendar synchronization races
        run: node scripts/test-calendar-sync.mjs
      - name: Test calendar creation acknowledgments
        run: node scripts/test-calendar-create.mjs
      - name: Synthetic client cache benchmark
        run: node scripts/benchmark-api-client.mjs
